name: Tests

on:
  pull_request:
    branches: [main, "m1-*"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
